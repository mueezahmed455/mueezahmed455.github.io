title: Mueez Ahmed
email: mueezahmad69@gmail.com
description: >-
  Software engineering, AI infrastructure and applied research.
  Product work, system design and technical experiments by Mueez Ahmed.
url: "https://mueezahmed455.github.io"
baseurl: ""
github_username: mueezahmed455

markdown: kramdown
highlighter: rouge
permalink: pretty

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - README.md
  - docs
