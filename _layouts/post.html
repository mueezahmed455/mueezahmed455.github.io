---
layout: default
---
<article class="article-page">
  <div class="container article-container">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← Back to notes</a>
    <header class="article-header">
      <p class="eyebrow"><span class="eyebrow-line"></span> Field notes · {{ page.date | date: "%d %B %Y" }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.tags %}
      <div class="tag-row">
        {% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}
      </div>
      {% endif %}
    </header>
    <div class="article-content">
      {{ content }}
    </div>
  </div>
</article>
