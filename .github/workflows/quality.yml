name: Portfolio quality

on:
  push:
    branches:
      - main
      - portfolio/visual-depth-and-interactions
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/labs.js
          node --check assets/js/network-field.js

      - name: Build Jekyll site
        run: bundle exec jekyll build
